<script>
BI.Charts={
  palette(){const css=getComputedStyle(document.documentElement);return{primary:css.getPropertyValue('--primary').trim(),teal:css.getPropertyValue('--teal').trim(),amber:css.getPropertyValue('--amber').trim(),red:css.getPropertyValue('--red').trim(),purple:css.getPropertyValue('--purple').trim(),text:css.getPropertyValue('--text').trim(),muted:css.getPropertyValue('--muted').trim(),line:css.getPropertyValue('--line').trim(),surface:css.getPropertyValue('--surface').trim()};},
  context(id){const canvas=BI.$(id),ratio=Math.min(window.devicePixelRatio||1,2),width=Math.max(1,canvas.clientWidth),height=Math.max(1,canvas.clientHeight);canvas.width=width*ratio;canvas.height=height*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,width,height);return{canvas,ctx,width,height,colors:this.palette()};},
  rect(ctx,x,y,w,h,r=4){
    const radius=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
    if(ctx.roundRect&&radius>0&&Math.abs(w)>=1&&Math.abs(h)>=1){try{ctx.roundRect(x,y,w,h,radius);return;}catch(e){}}
    ctx.rect(x,y,w,h);
  },
  renderAll(scope){this.performance();this.flow(scope);this.gauge(scope);this.detergentComparison();this.categoryMix();},
  detergentComparison(){
    const canvasEl=BI.$('detergentComparisonChart');if(!canvasEl)return;
    const chart=this.context('detergentComparisonChart');
    const analysis=(BI.state.data&&BI.state.data.products&&BI.state.data.products.detergentAnalysis)||{};
    const scope=BI.state.scope||(BI.state.data&&BI.state.data.executive)||{};
    const mode=BI.state.productMode||'VALUE';
    const isVal=mode==='VALUE';
    const targetName=analysis.targetCategory||'Detergent';
    const valTarget=scope.detergentSales!=null?scope.detergentSales:(analysis.detergentSales||0);
    const valOthers=scope.othersSales!=null?scope.othersSales:(analysis.othersSales||0);
    const pctTarget=scope.detergentSalesPct!=null?scope.detergentSalesPct:(analysis.detergentSalesPct||0);
    const pctOthers=scope.othersSalesPct!=null?scope.othersSalesPct:(analysis.othersSalesPct||0);
    const volTarget=scope.detergentVolume!=null?scope.detergentVolume:(analysis.detergentVolume||0);
    const volOthers=analysis.othersVolume||0;
    const rows=[
      ['🧼 '+targetName, isVal?valTarget:pctTarget, chart.colors.teal, isVal?BI.number(valTarget):BI.percent(pctTarget), volTarget],
      ['📦 Others', isVal?valOthers:pctOthers, chart.colors.purple, isVal?BI.number(valOthers):BI.percent(pctOthers), volOthers]
    ];
    const max=Math.max(1,...rows.map(x=>x[1]||0));
    const {ctx,width,height,colors}=chart,left=110,right=130,top=25,rowH=Math.min(45,(height-top-20)/rows.length);
    BI.state.chartHits.detergent=[];
    ctx.font='12px Inter, sans-serif';
    rows.forEach((row,index)=>{
      const y=top+index*(rowH+15);
      const h=rowH;
      const w=(width-left-right)*(row[1]||0)/max;
      ctx.fillStyle=colors.muted;
      ctx.textAlign='left';
      ctx.fillText(row[0],10,y+h/2);
      ctx.fillStyle=colors.line;
      ctx.beginPath();
      this.rect(ctx,left,y,width-left-right,h,6);
      ctx.fill();
      ctx.fillStyle=row[2];
      ctx.beginPath();
      this.rect(ctx,left,y,Math.max(w,4),h,6);
      ctx.fill();
      const textVal = row[3]+(isVal?' ('+BI.percent(index===0?pctTarget:pctOthers)+')':'');
      const textWidth = ctx.measureText(textVal).width;
      const fitOutside = left + w + 10 + textWidth <= width - 10;
      ctx.fillStyle = fitOutside ? colors.text : '#ffffff';
      ctx.textAlign = fitOutside ? 'left' : 'right';
      ctx.fillText(textVal, fitOutside ? left + Math.max(w, 4) + 10 : left + Math.max(w, 4) - 10, y + h / 2);
      BI.state.chartHits.detergent.push({x:left,y,w:Math.max(w,4),h,label:row[0],series:mode==='VALUE'?'Sales Value':'% Share',value:row[1]});
    });
    this.bindTooltip(chart.canvas,'detergentTooltip','detergent');
  },
  categoryMix(){
    const canvasEl=BI.$('categoryMixChart');if(!canvasEl)return;
    const chart=this.context('categoryMixChart');
    const categories=(BI.state.data&&BI.state.data.products&&BI.state.data.products.categories)||[];
    if(!categories.length)return this.message(chart,'No category data');
    const mode=BI.state.productMode||'VALUE';
    const isVal=mode==='VALUE';
    const rows=categories.slice(0,6).map(c=>[c.name||'Group', isVal?c.sales||0:c.salesPct||0, chart.colors.primary, isVal?BI.number(c.sales):BI.percent(c.salesPct)]);
    const max=Math.max(1,...rows.map(x=>x[1]||0));
    const {ctx,width,height,colors}=chart,left=90,right=100,top=15,rowH=(height-top-10)/rows.length;
    BI.state.chartHits.category=[];
    ctx.font='11px Inter, sans-serif';
    rows.forEach((row,index)=>{
      const y=top+index*rowH+4,h=Math.min(22,rowH-8),w=(width-left-right)*(row[1]||0)/max;
      ctx.fillStyle=colors.muted;
      ctx.textAlign='left';
      ctx.fillText(row[0].slice(0,14),8,y+h/2);
      ctx.fillStyle=colors.line;
      ctx.beginPath();
      this.rect(ctx,left,y,width-left-right,h,4);
      ctx.fill();
      ctx.fillStyle=colors.primary;
      ctx.beginPath();
      this.rect(ctx,left,y,Math.max(w,2),h,4);
      ctx.fill();
      ctx.fillStyle=colors.text;
      ctx.fillText(row[3],left+w+8,y+h/2);
      BI.state.chartHits.category.push({x:left,y,w:Math.max(w,2),h,label:row[0],series:mode==='VALUE'?'Sales Value':'% Share',value:row[1]});
    });
    this.bindTooltip(chart.canvas,'categoryTooltip','category');
  },
  performance(){const chart=this.context('performanceChart'),level=BI.state.activeLevel==='COMPANY'?'RSM':BI.state.activeLevel,source=BI.state.activeLevel==='COMPANY'?(BI.state.data.hierarchy[level]||[]):[BI.state.scope],rows=[...source].sort((a,b)=>(b.sales||0)-(a.sales||0)).slice(0,10);if(!rows.length)return this.message(chart,'No performance data');const {ctx,width,height,colors}=chart,pad={left:64,right:18,top:15,bottom:58},plotW=width-pad.left-pad.right,plotH=height-pad.top-pad.bottom,max=Math.max(1,...rows.flatMap(x=>[x.sales||0,x.target||0,x.forecast||0]));ctx.font='10px Inter, sans-serif';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=pad.top+plotH*i/4;ctx.strokeStyle=colors.line;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillStyle=colors.muted;ctx.textAlign='right';ctx.fillText(BI.number(max*(1-i/4)),pad.left-9,y)}const group=plotW/rows.length,bar=Math.max(5,Math.min(17,group/4));BI.state.chartHits.performance=[];rows.forEach((row,index)=>{const center=pad.left+group*(index+.5);[['Sales',row.sales||0,colors.primary],['Target',row.target||0,colors.amber],['Forecast',row.forecast||0,colors.teal]].forEach((series,s)=>{const h=plotH*series[1]/max,x=center+(s-1)*bar-bar/2,y=pad.top+plotH-h;ctx.fillStyle=series[2];ctx.beginPath();this.rect(ctx,x,y,bar,h,3);ctx.fill();BI.state.chartHits.performance.push({x,y,w:bar,h,label:BI.entityName(row,level,index),series:series[0],value:series[1]})});ctx.save();ctx.translate(center,height-pad.bottom+12);ctx.rotate(-.3);ctx.fillStyle=colors.muted;ctx.textAlign='right';ctx.fillText(BI.entityName(row,level,index).slice(0,22),0,0);ctx.restore()});this.bindTooltip(chart.canvas,'performanceTooltip','performance');},
  flow(scope){const chart=this.context('flowChart'),rows=[['Sales',scope.sales,chart.colors.primary],['Collection',scope.collection,chart.colors.teal],['Lifting',scope.lifting,chart.colors.purple],['Projection',scope.projection,chart.colors.amber],['Secondary',scope.secondary,chart.colors.red],['Stock',scope.stock,'#64748b']],max=Math.max(1,...rows.map(x=>x[1]||0)),{ctx,width,height,colors}=chart,left=96,right=120,top=15,rowH=(height-top-12)/rows.length;BI.state.chartHits.flow=[];ctx.font='11px Inter, sans-serif';rows.forEach((row,index)=>{const y=top+index*rowH+8,h=Math.min(25,rowH-10),w=(width-left-right)*(row[1]||0)/max;ctx.fillStyle=colors.muted;ctx.textAlign='left';ctx.fillText(row[0],8,y+h/2);ctx.fillStyle=colors.line;ctx.beginPath();this.rect(ctx,left,y,width-left-right,h,5);ctx.fill();ctx.fillStyle=row[2];ctx.beginPath();this.rect(ctx,left,y,Math.max(w,2),h,5);ctx.fill();ctx.fillStyle=colors.text;ctx.fillText(BI.number(row[1]),left+w+8,y+h/2);BI.state.chartHits.flow.push({x:left,y,w:Math.max(w,2),h,label:row[0],series:row[0],value:row[1]})});this.bindTooltip(chart.canvas,'flowTooltip','flow');},
  gauge(scope){const chart=this.context('achievementChart'),{ctx,width,height,colors}=chart,value=Math.max(0,scope.achievementPct||0),shown=Math.min(value,1),centerX=width/2,centerY=height*.74,radius=Math.min(width*.35,height*.55);ctx.lineWidth=20;ctx.lineCap='round';ctx.strokeStyle=colors.line;ctx.beginPath();ctx.arc(centerX,centerY,radius,Math.PI,Math.PI*2);ctx.stroke();ctx.strokeStyle=value>=1?colors.teal:value>=.75?colors.primary:value>=.5?colors.amber:colors.red;ctx.beginPath();ctx.arc(centerX,centerY,radius,Math.PI,Math.PI+Math.PI*shown);ctx.stroke();BI.$('achievementValue').textContent=BI.percent(scope.achievementPct);BI.$('achievementGap').textContent=BI.number(scope.gap);},
  bindTooltip(canvas,tooltipId,key){canvas.onmousemove=event=>{const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top,hit=(BI.state.chartHits[key]||[]).find(item=>x>=item.x&&x<=item.x+item.w&&y>=item.y&&y<=item.y+item.h),tip=BI.$(tooltipId);if(!hit){tip.style.display='none';return}tip.innerHTML='<strong>'+BI.escape(hit.label)+'</strong><br>'+BI.escape(hit.series)+': '+BI.number(hit.value);tip.style.display='block';tip.style.left=Math.min(x+12,rect.width-170)+'px';tip.style.top=Math.max(5,y-45)+'px'};canvas.onmouseleave=()=>BI.$(tooltipId).style.display='none';},
  message(chart,message){chart.ctx.fillStyle=chart.colors.muted;chart.ctx.textAlign='center';chart.ctx.fillText(message,chart.width/2,chart.height/2);}
};
</script>
