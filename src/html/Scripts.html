<script>
BI.cardDefinitions=[
  ['Net sales','sales','Revenue','var(--primary)',x=>BI.percent(x.achievementPct)+' of target'],
  ['Detergent %','detergentSalesPct','Detergent','var(--teal)',x=>'Detergent sales '+BI.number(x.detergentSales)],
  ['Others %','othersSalesPct','Others','var(--purple)',x=>'Other products sales '+BI.number(x.othersSales)],
  ['Target','target','Goal','var(--amber)',x=>'Gap '+BI.number(x.gap)],
  ['Forecast','forecast','Outlook','var(--teal)',x=>BI.percent(x.forecastAchievementPct)+' achievement'],
  ['Collection','collection','Cash','var(--purple)',x=>BI.percent(x.collectionFlowRatioPct)+' of sales'],
  ['Daily average','averageDailySales','Pace','var(--primary)',x=>'Day '+BI.number(x.currentWorkingDay)+' of '+BI.number(x.totalWorkingDay)],
  ['Required daily','requiredDailySales','Action','var(--red)',x=>BI.number(x.dueWorkingDay)+' working days remain'],
  ['Projection','projection','Plan','var(--amber)',x=>BI.number(x.dealerCount)+' dealers'],
  ['Lifting','lifting','Supply','var(--purple)',x=>'Stock '+BI.number(x.stock)],
  ['Secondary','secondary','Flow','var(--teal)',x=>'Commercial movement'],
  ['Growth','growthPct','Growth','var(--teal)',x=>x.growthComparable?'Comparable period':'Awaiting comparable period'],
  ['Momentum','momentumPct','Trend','var(--primary)',x=>BI.title(x.momentumDirection||'Insufficient data')],
  ['Products','productCount','Mix','var(--purple)',x=>BI.number(x.srCount)+' sales representatives'],
  ['Present','present','Attendance','var(--teal)',x=>'Absent '+BI.number(x.absent)],
  ['Attendance','attendancePct','Rate','var(--primary)',x=>'Matched to '+(x.attendancePeriodStart?x.attendancePeriodStart.slice(0,7):'selected Sales month')],
  ['Sales / present day','salesPerPresentDay','Efficiency','var(--amber)',x=>'Valid when present days are available']
];
BI.render=()=>{const scope=BI.state.scope||BI.state.data.executive;BI.$('scopeName').textContent=scope.periodStart?'Period '+scope.periodStart.slice(0,7):BI.entityName(scope,BI.state.activeLevel);BI.renderCards(scope);BI.renderForecast(scope);BI.renderDetergentSummary();BI.renderRankings();BI.Tables.render();requestAnimationFrame(()=>BI.Charts.renderAll(scope));};
BI.renderDetergentSummary=()=>{const el=BI.$('detergentMetricsSummary');if(!el)return;const scope=BI.state.scope||(BI.state.data&&BI.state.data.executive)||{};const a=(BI.state.data&&BI.state.data.products&&BI.state.data.products.detergentAnalysis)||{};const target=a.targetCategory||'Detergent';const detSales=scope.detergentSales!=null?scope.detergentSales:a.detergentSales;const detPct=scope.detergentSalesPct!=null?scope.detergentSalesPct:a.detergentSalesPct;const othSales=scope.othersSales!=null?scope.othersSales:a.othersSales;const othPct=scope.othersSalesPct!=null?scope.othersSalesPct:a.othersSalesPct;const rows=[['Detergent Segment Sales',BI.number(detSales)],['Detergent Sales Share %',BI.percent(detPct)],['Detergent Volume',BI.number(scope.detergentVolume||a.detergentVolume)],['Detergent Volume Share %',BI.percent(a.detergentVolumePct)],['Other Products Sales',BI.number(othSales)],['Other Products Sales Share %',BI.percent(othPct)],['Other Products Volume',BI.number(a.othersVolume)],['Other Products Volume Share %',BI.percent(a.othersVolumePct)],['Total Scope Sales',BI.number(scope.sales||a.totalCompanySales)]];el.innerHTML=rows.map(r=>'<div class="forecast-row"><span>'+r[0]+'</span><strong>'+r[1]+'</strong></div>').join('');};
BI.renderCards=scope=>{const volume=['PRODUCT','CATEGORY'].includes(BI.state.activeLevel),cards=volume?[['Product volume','productVolume','Volume','var(--primary)',x=>'Source-unit quantity'],['Mix','mixPct','Mix','var(--teal)',x=>'Compatible source units only'],['Rank','rank','Rank','var(--amber)',x=>'Volume rank'],['Records','recordCount','Facts','var(--purple)',x=>'Certified product observations']]:BI.cardDefinitions;BI.$('kpiGrid').innerHTML=cards.map((card,index)=>{const isPercent=card[1].toLowerCase().includes('pct'),value=isPercent?BI.percent(scope[card[1]]):BI.number(scope[card[1]]);return'<article class="kpi-card" tabindex="0" style="--card-color:'+card[3]+'" data-section="'+(index<4?'performance':'commercial')+'"><div class="kpi-top"><span>'+card[0]+'</span><span class="kpi-icon">'+card[2].slice(0,1)+'</span></div><div class="kpi-value">'+value+'</div><div class="kpi-note">'+BI.escape(card[4](scope))+'</div></article>'}).join('');BI.$('kpiGrid').querySelectorAll('.kpi-card').forEach(card=>card.addEventListener('click',()=>BI.$(card.dataset.section).scrollIntoView({behavior:'smooth'})));};
BI.renderForecast=scope=>{const base=scope.forecastBase||{},rows=[['Forecast sales',BI.number(scope.forecast)],['Matured posted sales',BI.number(base.maturedSales)],['Data cutoff',base.dataCutoffDate||'Not available'],['Forecast achievement',BI.percent(scope.forecastAchievementPct)],['Average daily sales',BI.number(scope.averageDailySales)],['Required daily sales',BI.number(scope.requiredDailySales)],['Matured working days',BI.number(scope.currentWorkingDay)],['Working days remaining',BI.number(scope.dueWorkingDay)],['Momentum',BI.percent(scope.momentumPct)],['Direction',BI.title(scope.momentumDirection||'Insufficient data')]];BI.$('forecastSummary').innerHTML=rows.map(row=>'<div class="forecast-row"><span>'+row[0]+'</span><strong>'+row[1]+'</strong></div>').join('');};
BI.renderRankings=()=>{const render=(id,rows,type,valueKey)=>{const max=Math.max(1,...rows.map(x=>x[valueKey]||0));BI.$(id).innerHTML=rows.length?rows.slice(0,8).map((row,index)=>'<div class="ranking-row"><span class="rank">'+(index+1)+'</span><div class="rank-copy"><strong title="'+BI.escape(BI.entityName(row,type,index))+'">'+BI.escape(BI.entityName(row,type,index))+'</strong><div class="rank-bar"><i style="width:'+Math.max(2,(row[valueKey]||0)*100/max)+'%"></i></div></div><span class="rank-value">'+BI.number(row[valueKey])+'</span></div>').join(''):BI.empty('No ranking available','The certified cache contains no records for this dimension.');};render('dealerRanking',BI.state.data.dealers.top||[],'DEALER','sales');render('productRanking',BI.state.data.products.topProducts||[],'PRODUCT','productVolume');};
BI.setStatus=(type,title,text)=>{const state=BI.$('loadState');state.className='load-state '+type;BI.$('statusTitle').textContent=title;BI.$('statusText').textContent=text;if(type!=='loading'){clearInterval(BI.refreshTimer);BI.$('elapsed').textContent=''}};
BI.accept=result=>{if(!result||!result.ok){const message=result&&result.error?result.error.message:'Certified KPI cache is unavailable';BI.setStatus('error','Dashboard unavailable',message);return}BI.state.data=result.data;BI.state.scope=result.data.executive;BI.state.activeLevel='COMPANY';BI.$('dashboard').hidden=false;BI.$('generatedStamp').textContent='Generated '+BI.date(result.data.generatedAt);BI.$('sideStamp').textContent=BI.date(result.data.generatedAt);BI.$('certification').textContent=result.data.quality&&result.data.quality.certification==='CERTIFIED'?'Certified':'Not Certified';BI.Filters.populate();BI.render();BI.setStatus('ready','','');};
BI.fail=error=>BI.setStatus('error','Connection failed',error&&error.message?error.message:'Apps Script did not return a response.');
BI.refresh=()=>{const button=BI.$('refreshButton');if(button.disabled)return;button.disabled=true;button.classList.add('refreshing');const started=Date.now();BI.setStatus('loading','Refreshing business data','Running Data Engine, KPI Engine, and publishing certified cache...');BI.refreshTimer=setInterval(()=>BI.$('elapsed').textContent=Math.floor((Date.now()-started)/1000)+'s',1000);google.script.run.withSuccessHandler(result=>{button.disabled=false;button.classList.remove('refreshing');if(result&&result.ok){BI.accept(result);BI.toast('Certified dashboard refreshed');}else{const msg=result&&result.error?result.error.message:'Refresh failed';if(BI.state.data){BI.setStatus('ready','','');BI.toast('Refresh failed: '+msg);}else BI.accept(result);}}).withFailureHandler(error=>{button.disabled=false;button.classList.remove('refreshing');const msg=error&&error.message?error.message:'Connection failed';if(BI.state.data){BI.setStatus('ready','','');BI.toast('Refresh failed: '+msg);}else BI.fail(error);}).refreshDashboardData();};
BI.boot=()=>{
  BI.Theme.init();BI.Filters.init();BI.Tables.init();
  BI.state.productMode='VALUE';
  const valBtn=BI.$('btnValMode'),pctBtn=BI.$('btnPctMode');
  if(valBtn&&pctBtn){
    valBtn.addEventListener('click',()=>{BI.state.productMode='VALUE';valBtn.classList.add('active');pctBtn.classList.remove('active');BI.Charts.detergentComparison();BI.Charts.categoryMix();});
    pctBtn.addEventListener('click',()=>{BI.state.productMode='PCT';pctBtn.classList.add('active');valBtn.classList.remove('active');BI.Charts.detergentComparison();BI.Charts.categoryMix();});
  }
  BI.$('refreshButton').addEventListener('click',BI.refresh);
  BI.$('kpiGrid').innerHTML=Array.from({length:8},()=>'<div class="skeleton"></div>').join('');
  window.addEventListener('resize',BI.debounce(()=>BI.state.data&&BI.Charts.renderAll(BI.state.scope||BI.state.data.executive),100));
  google.script.run.withSuccessHandler(BI.accept).withFailureHandler(BI.fail).getCachedDashboardApi();
};
BI.boot();
</script>
