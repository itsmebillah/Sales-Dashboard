<script>
let DATA=null,started=0,timer=null;
const $=id=>document.getElementById(id),fmt=v=>v==null||!isFinite(v)?'—':Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(v),pct=v=>v==null||!isFinite(v)?'—':(v*100).toFixed(1)+'%';
function boot(){setStatus('loading','Reading certified KPI cache…');google.script.run.withSuccessHandler(load).withFailureHandler(fail).getCachedDashboardApi()}
function load(result){if(!result||!result.ok){setStatus('error',result&&result.error?result.error.message:'Certified KPI cache unavailable');return}DATA=result.data;$('dashboard').hidden=false;$('stamp').textContent='Generated '+new Date(DATA.generatedAt).toLocaleString();populateEntities();render();setStatus('ready','Certified KPI cache loaded')}
function fail(e){setStatus('error',e&&e.message?e.message:'Server request failed')}
function setStatus(type,text){$('status').className='status '+type;$('statusText').textContent=text;if(type!=='loading'){$('elapsed').textContent='';clearInterval(timer)}}
function startRefresh(){if(started)return;started=Date.now();$('refresh').disabled=true;setStatus('loading','Refreshing source data, rebuilding KPIs and publishing cache…');timer=setInterval(()=>$('elapsed').textContent=Math.floor((Date.now()-started)/1000)+'s',1000);google.script.run.withSuccessHandler(r=>{started=0;$('refresh').disabled=false;if(r&&r.ok)load(r);else setStatus('error',r&&r.error?r.error.message:'Refresh failed')}).withFailureHandler(e=>{started=0;$('refresh').disabled=false;fail(e)}).refreshDashboardData()}
function rows(){return DATA&&DATA.hierarchy[$('level').value]||[]}
function populateEntities(){let s=$('entity'),current=s.value;s.innerHTML='<option value="ALL">Company total</option>'+rows().map(x=>'<option value="'+esc(x.entityId)+'">'+esc(x.entityId)+'</option>').join('');s.value=[...s.options].some(x=>x.value===current)?current:'ALL'}
function changeLevel(){populateEntities();render()}
function selected(){let id=$('entity').value;return id==='ALL'?DATA.executive:rows().find(x=>x.entityId===id)||DATA.executive}
function render(){if(!DATA)return;let x=selected(),id=$('entity').value;$('scopeName').textContent=id==='ALL'?'Company':id;renderCards(x);drawPerformance(id==='ALL'?rows():[x]);drawFlow(x);renderList('risks',DATA.risks||[],r=>'<span class="badge">'+esc(r.severity)+'</span><strong>'+esc(r.entityType+': '+r.entityId)+'</strong><p>'+esc(r.reason||r.metric)+'</p>',8);renderList('insights',DATA.insights||[],r=>'<strong>'+esc(String(r.type).replaceAll('_',' '))+'</strong><p>'+esc(r.entity+': '+r.entityId)+' · '+esc(r.metric)+': '+fmt(r.value)+'</p>',8);renderEntities('dealers',DATA.dealers.top||[]);renderEntities('products',DATA.products.topProducts||[]);renderTable(id==='ALL'?rows():[x]);$('tableTitle').textContent=$('level').value+' performance register'}
function renderCards(x){let cards=[['Net Sales',x.sales,pct(x.achievementPct)+' of target'],['Target',x.target,'Gap '+fmt(x.gap)],['Forecast',x.forecast,pct(x.forecastAchievementPct)+' achievement'],['Daily Average',x.averageDailySales,'Working day '+fmt(x.currentWorkingDay)+' of '+fmt(x.totalWorkingDay)],['Required Daily',x.requiredDailySales,fmt(x.dueWorkingDay)+' days remain'],['Collection',x.collection,pct(x.collectionFlowRatioPct)+' of sales'],['Projection',x.projection,fmt(x.dealerCount)+' dealers'],['Lifting',x.lifting,'Stock '+fmt(x.stock)],['Secondary',x.secondary,'Commercial flow'],['Growth',x.growthPct,x.growthComparable?'Comparable growth':'Not comparable'],['Momentum',x.momentumPct,x.trend],['Products',x.productCount,fmt(x.srCount)+' SRs']];$('cards').innerHTML=cards.map(c=>'<article class="card"><label>'+c[0]+'</label><div class="value">'+fmt(c[1])+'</div><div class="note">'+esc(c[2])+'</div></article>').join('')}
function renderList(id,list,fn,max){$(id).innerHTML=list.length?list.slice(0,max).map(x=>'<div class="item">'+fn(x)+'</div>').join(''):'<div class="item">No active items</div>'}
function renderEntities(id,list){$(id).innerHTML='<div class="entity-grid">'+list.slice(0,10).map(x=>'<div class="entity-card"><strong>'+esc(x.entityId)+'</strong><small>Sales '+fmt(x.sales)+' · Achievement '+pct(x.achievementPct)+'</small></div>').join('')+'</div>'}
function renderTable(list){let r=[...list].sort((a,b)=>b.sales-a.sales).slice(0,20);$('performanceTable').innerHTML='<div class="desktop-table"><table><thead><tr><th>Entity</th><th>Sales</th><th>Target</th><th>Ach.</th><th>Forecast</th><th>Trend</th></tr></thead><tbody>'+r.map(x=>'<tr><td>'+esc(x.entityId)+'</td><td>'+fmt(x.sales)+'</td><td>'+fmt(x.target)+'</td><td>'+pct(x.achievementPct)+'</td><td>'+fmt(x.forecast)+'</td><td>'+esc(x.trend)+'</td></tr>').join('')+'</tbody></table></div><div class="mobile-rows">'+r.map(x=>'<div class="mobile-row"><strong>'+esc(x.entityId)+'</strong><div><span>Sales '+fmt(x.sales)+'</span><span>Ach. '+pct(x.achievementPct)+'</span><span>Forecast '+fmt(x.forecast)+'</span><span>'+esc(x.trend)+'</span></div></div>').join('')+'</div>'}
function canvas(id){let c=$(id),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);return{g,w,h}}
function drawPerformance(list){let a=canvas('performanceChart'),r=[...list].sort((x,y)=>y.sales-x.sales).slice(0,8),max=Math.max(1,...r.flatMap(x=>[x.sales,x.target,x.forecast||0])),pad=35,group=(a.w-pad*2)/Math.max(r.length,1);a.g.font='10px Arial';r.forEach((x,i)=>{[['#176b5b',x.sales],['#f0a23b',x.target],['#72a7d8',x.forecast||0]].forEach((v,j)=>{let bh=(a.h-75)*v[1]/max;a.g.fillStyle=v[0];a.g.fillRect(pad+i*group+j*(group/4),a.h-40-bh,Math.max(4,group/5),bh)});a.g.save();a.g.translate(pad+i*group,a.h-22);a.g.rotate(-.35);a.g.fillStyle='#667085';a.g.fillText(String(x.entityId).slice(-12),0,0);a.g.restore()})}
function drawFlow(x){let a=canvas('flowChart'),r=[['Sales',x.sales],['Collection',x.collection],['Lifting',x.lifting],['Projection',x.projection],['Secondary',x.secondary],['Stock',x.stock]],max=Math.max(1,...r.map(x=>x[1]||0));a.g.font='11px Arial';r.forEach((v,i)=>{let y=15+i*(a.h-20)/r.length,w=(a.w-105)*(v[1]||0)/max;a.g.fillStyle='#667085';a.g.fillText(v[0],4,y+15);a.g.fillStyle=['#176b5b','#4a8fc2','#7059a6','#f0a23b','#60a889','#c6636b'][i];a.g.fillRect(78,y,w,22);a.g.fillStyle='#17233c';a.g.fillText(fmt(v[1]),82+w,y+15)})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.addEventListener('resize',()=>DATA&&render());boot();
</script>
