<script>
BI.Tables={
  columns:[['entity','Entity'],['sales','Sales'],['target','Target'],['achievementPct','Achievement'],['forecast','Forecast'],['collection','Collection'],['projection','Projection'],['stock','Stock'],['trend','Trend']],
  init(){BI.$('previousPage').addEventListener('click',()=>{BI.state.page=Math.max(1,BI.state.page-1);this.render()});BI.$('nextPage').addEventListener('click',()=>{BI.state.page++;this.render()});BI.$('exportButton').addEventListener('click',()=>this.exportCsv());},
  rows(){const level=BI.$('reportLevel').value,search=BI.state.search;return(BI.state.data.hierarchy[level]||[]).map((row,index)=>Object.assign({_name:BI.entityName(row,level,index)},row)).filter(row=>!search||row._name.toLowerCase().includes(search)||Object.keys(row).some(key=>String(row[key]).toLowerCase().includes(search)));},
  sorted(){const key=BI.state.sortKey,direction=BI.state.sortDirection==='asc'?1:-1;return this.rows().sort((a,b)=>{const av=key==='entity'?a._name:a[key],bv=key==='entity'?b._name:b[key];return(typeof av==='number'&&typeof bv==='number'?(av-bv):String(av||'').localeCompare(String(bv||'')))*direction});},
  render(){if(!BI.state.data)return;const all=this.sorted(),pages=Math.max(1,Math.ceil(all.length/BI.state.pageSize));BI.state.page=Math.min(BI.state.page,pages);const start=(BI.state.page-1)*BI.state.pageSize,rows=all.slice(start,start+BI.state.pageSize);if(!all.length){BI.$('reportTable').innerHTML=BI.empty('No matching results','Adjust the search or reporting level.')}else{BI.$('reportTable').innerHTML='<div class="table-scroll"><table><thead><tr>'+this.columns.map(column=>'<th data-key="'+column[0]+'">'+column[1]+(BI.state.sortKey===column[0]?(BI.state.sortDirection==='asc'?' ↑':' ↓'):'')+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr><td class="entity-cell">'+BI.escape(row._name)+'</td><td>'+BI.number(row.sales)+'</td><td>'+BI.number(row.target)+'</td><td>'+BI.percent(row.achievementPct)+'</td><td>'+BI.number(row.forecast)+'</td><td>'+BI.number(row.collection)+'</td><td>'+BI.number(row.projection)+'</td><td>'+BI.number(row.stock)+'</td><td class="'+(String(row.trend).toUpperCase()==='UP'?'trend-up':String(row.trend).toUpperCase()==='DOWN'?'trend-down':'')+'">'+BI.escape(BI.title(row.trend||'Stable'))+'</td></tr>').join('')+'</tbody></table></div>';BI.$('reportTable').querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;BI.state.sortDirection=BI.state.sortKey===key&&BI.state.sortDirection==='desc'?'asc':'desc';BI.state.sortKey=key;this.render()}))}BI.$('pageSummary').textContent=all.length?BI.number(start+1)+'–'+BI.number(Math.min(start+BI.state.pageSize,all.length))+' of '+BI.number(all.length):'0 results';BI.$('previousPage').disabled=BI.state.page<=1;BI.$('nextPage').disabled=BI.state.page>=pages;},
  exportCsv(){const rows=this.sorted(),columns=this.columns;if(!rows.length)return BI.toast('No report rows to export');const quote=value=>'"'+String(value==null?'':value).replace(/"/g,'""')+'"',content=[columns.map(x=>quote(x[1])).join(',')].concat(rows.map(row=>columns.map(column=>quote(column[0]==='entity'?row._name:row[column[0]])).join(','))).join('\r\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='sales-intelligence-'+BI.$('reportLevel').value.toLowerCase()+'.csv';link.click();URL.revokeObjectURL(url);BI.toast('CSV export prepared');}
};
</script>
