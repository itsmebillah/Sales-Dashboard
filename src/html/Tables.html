<script>
BI.Tables={
  columns:[['entity','Entity'],['sales','Sales'],['target','Target'],['achievementPct','Achievement'],['contributionPct','Contribution %'],['detergentSalesPct','Detergent %'],['othersSalesPct','Others %'],['forecast','Forecast'],['present','Present'],['absent','Absent'],['attendancePct','Attendance %'],['salesPerPresentDay','Sales / Present Day'],['trend','Trend']],
  init(){BI.$('previousPage').addEventListener('click',()=>{BI.state.page=Math.max(1,BI.state.page-1);this.render()});BI.$('nextPage').addEventListener('click',()=>{BI.state.page++;this.render()});BI.$('exportButton').addEventListener('click',()=>this.exportCsv())},
  rows(){const level=(BI.$('reportLevel')&&BI.$('reportLevel').value)||'RSM',search=BI.state.search;return((BI.state.data&&BI.state.data.hierarchy&&BI.state.data.hierarchy[level])||[]).map((row,index)=>Object.assign({_name:BI.entityName(row,level,index)},row)).filter(row=>!search||row._name.toLowerCase().includes(search)||(row.entityId&&row.entityId.toLowerCase().includes(search))||['sales','target','forecast','present','absent'].some(k=>row[k]!=null&&String(row[k]).toLowerCase().includes(search)))},
  sorted(){const key=BI.state.sortKey,direction=BI.state.sortDirection==='asc'?1:-1;return this.rows().sort((a,b)=>{const av=key==='entity'?a._name:a[key],bv=key==='entity'?b._name:b[key];return(typeof av==='number'&&typeof bv==='number'?(av-bv):String(av||'').localeCompare(String(bv||'')))*direction})},
  render(){
    if(!BI.state.data)return;
    const all=this.sorted(),pages=Math.max(1,Math.ceil(all.length/BI.state.pageSize));
    BI.state.page=Math.min(BI.state.page,pages);
    const start=(BI.state.page-1)*BI.state.pageSize,rows=all.slice(start,start+BI.state.pageSize);
    if(!all.length)BI.$('reportTable').innerHTML=BI.empty('No matching results','Adjust the search or reporting level.');
    else{
      BI.$('reportTable').innerHTML='<div class="table-scroll"><table><thead><tr>'+this.columns.map(column=>'<th data-key="'+column[0]+'">'+column[1]+(BI.state.sortKey===column[0]?(BI.state.sortDirection==='asc'?' &#8593;':' &#8595;'):'')+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr><td class="entity-cell">'+BI.escape(row._name)+'</td><td>'+BI.number(row.sales)+'</td><td>'+BI.number(row.target)+'</td><td>'+BI.percent(row.achievementPct)+'</td><td>'+BI.percent(row.contributionPct)+'</td><td><span class="badge badge-primary">'+BI.percent(row.detergentSalesPct)+'</span></td><td><span class="badge badge-secondary">'+BI.percent(row.othersSalesPct)+'</span></td><td>'+BI.number(row.forecast)+'</td><td>'+BI.number(row.present)+'</td><td>'+BI.number(row.absent)+'</td><td>'+BI.percent(row.attendancePct)+'</td><td>'+BI.number(row.salesPerPresentDay)+'</td><td class="'+(String(row.trend).toUpperCase()==='UP'?'trend-up':String(row.trend).toUpperCase()==='DOWN'?'trend-down':'')+'">'+BI.escape(BI.title(row.trend||'Stable'))+'</td></tr>').join('')+'</tbody></table></div>';
      BI.$('reportTable').querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;BI.state.sortDirection=BI.state.sortKey===key&&BI.state.sortDirection==='desc'?'asc':'desc';BI.state.sortKey=key;this.render()}));
    }
    this.renderMobile(rows);
    BI.$('pageSummary').textContent=all.length?BI.number(start+1)+'\u2013'+BI.number(Math.min(start+BI.state.pageSize,all.length))+' of '+BI.number(all.length):'0 results';
    BI.$('previousPage').disabled=BI.state.page<=1;BI.$('nextPage').disabled=BI.state.page>=pages;
  },
  renderMobile(rows){const mobile=BI.$('mobileReport');if(!rows.length){mobile.innerHTML=BI.empty('No matching results','Adjust the search or reporting level.');return}mobile.innerHTML=rows.map(row=>'<article><strong>'+BI.escape(row._name)+'</strong><div class="mobile-metrics"><span>Sales<b>'+BI.number(row.sales)+'</b></span><span>Target<b>'+BI.number(row.target)+'</b></span><span>Achievement<b>'+BI.percent(row.achievementPct)+'</b></span><span>Contribution %<b>'+BI.percent(row.contributionPct)+'</b></span><span>Detergent %<b>'+BI.percent(row.detergentSalesPct)+'</b></span><span>Others %<b>'+BI.percent(row.othersSalesPct)+'</b></span><span>Forecast<b>'+BI.number(row.forecast)+'</b></span><span>Present<b>'+BI.number(row.present)+'</b></span><span>Attendance<b>'+BI.percent(row.attendancePct)+'</b></span><span>Sales / Present Day<b>'+BI.number(row.salesPerPresentDay)+'</b></span></div></article>').join('')},
  exportCsv(){const rows=this.sorted(),columns=this.columns;if(!rows.length)return BI.toast('No report rows to export');const fmt=(k,v)=>{if(v==null)return'';if(k.toLowerCase().includes('pct'))return BI.percent(v);if(typeof v==='number')return BI.number(v);return v};const quote=value=>'"'+String(value==null?'':value).replace(/"/g,'""')+'"',content=[columns.map(x=>quote(x[1])).join(',')].concat(rows.map(row=>columns.map(column=>quote(column[0]==='entity'?row._name:fmt(column[0],row[column[0]]))).join(','))).join('\r\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;const lvl=((BI.$('reportLevel')&&BI.$('reportLevel').value)||'report').toLowerCase();link.download='sales-intelligence-'+lvl+'.csv';link.click();URL.revokeObjectURL(url);BI.toast('CSV export prepared')}
};
</script>
