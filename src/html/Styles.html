<style>
:root{--ink:#17233c;--muted:#667085;--line:#e5e9f2;--paper:#fff;--canvas:#f4f7fb;--brand:#176b5b;--accent:#f0a23b;--danger:#c2414b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(23,107,91,.13),transparent 34rem),var(--canvas);color:var(--ink);font:14px Arial,sans-serif}button,select{min-height:44px;touch-action:manipulation}main{max-width:1500px;margin:auto;padding:16px}.hero,.panel{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 10px 30px rgba(23,35,60,.055)}.hero{display:flex;justify-content:space-between;gap:24px;padding:30px;background:#17233c;color:#fff}.hero h1{font-size:42px;margin:8px 0}.hero p{color:#cbd5e1}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800;color:#42c6a7}.hero-actions{display:flex;align-items:flex-end;gap:12px;font-size:12px}.hero button{border:0;border-radius:12px;background:#42d6a4;padding:0 18px;font-weight:800;color:#10251f}.status{display:flex;align-items:center;gap:10px;margin:14px 0;padding:14px 18px;border-radius:14px;background:#eef6f4;color:#155e52}.status.error{background:#fff0f1;color:#9f2632}.status.ready{background:#eaf7ef;color:#176b3a}.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}.ready .spinner,.error .spinner{display:none}@keyframes spin{to{transform:rotate(360deg)}}.panel{padding:20px;margin-bottom:16px}.filters{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:14px}.filters label{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted)}select{display:block;width:100%;margin-top:6px;border:1px solid #ccd3df;border-radius:11px;background:white;padding:0 12px}.scope{background:#e8f6f2;border-radius:11px;padding:14px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.card{border:1px solid var(--line);background:white;border-radius:16px;padding:16px}.card label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.value{font-size:26px;font-weight:800;margin:12px 0 5px;font-variant-numeric:tabular-nums}.note{font-size:11px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-head h2{margin:5px 0 18px}.section-head .eyebrow{color:var(--brand)}canvas{width:100%;height:300px;display:block}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:9px;font-weight:800;background:#fee2e2;color:#991b1b;margin-right:7px}.entity-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.entity-card{border:1px solid var(--line);border-radius:12px;padding:12px}.entity-card strong{display:block;overflow-wrap:anywhere}.entity-card small{color:var(--muted)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{font-size:10px;text-transform:uppercase;color:var(--muted)}.mobile-rows{display:none}

@media(max-width:700px){main{padding:10px}.hero{padding:20px;flex-direction:column}.hero h1{font-size:29px}.hero-actions{align-items:stretch;flex-direction:column}.filters{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.panel{padding:15px;border-radius:15px}.entity-grid{grid-template-columns:1fr}canvas{height:250px}.desktop-table{display:none}.mobile-rows{display:grid;gap:8px}.mobile-row{border:1px solid var(--line);border-radius:12px;padding:12px}.mobile-row div{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.value{font-size:22px}}
</style>
