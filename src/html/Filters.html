<script>
BI.Filters={
  levels:['ASM','RSM','TSO','TERRITORY','AREA','SR','DEALER','PRODUCT'],
  init(){this.levels.forEach(level=>BI.$('filter'+level).addEventListener('change',event=>this.select(level,event.target.value)));BI.$('filterCATEGORY').addEventListener('change',event=>this.select('CATEGORY',event.target.value));BI.$('filterDATE').addEventListener('change',event=>this.selectDate(event.target.value));BI.$('clearFilters').addEventListener('click',()=>this.clear());BI.$('globalSearch').addEventListener('input',BI.debounce(event=>{BI.state.search=event.target.value.trim().toLowerCase();BI.state.page=1;BI.Tables.render()}));BI.$('reportLevel').addEventListener('change',()=>{BI.state.page=1;BI.Tables.render()});},
  populate(){this.levels.forEach(level=>{const select=BI.$('filter'+level),rows=BI.state.data.hierarchy[level]||[];select.innerHTML='<option value="">All '+BI.title(level)+'</option>'+rows.map((row,index)=>'<option value="'+BI.escape(row.entityId)+'">'+BI.escape(BI.entityName(row,level,index))+'</option>').join('');select.disabled=!rows.length;});const region=BI.$('filterREGION');region.innerHTML='<option value="">Region data unavailable</option>';region.disabled=true;const categories=BI.state.data.hierarchy.CATEGORY||[];BI.$('filterCATEGORY').innerHTML='<option value="">All Categories</option>'+categories.map((row,index)=>'<option value="'+BI.escape(row.entityId)+'">'+BI.escape(BI.entityName(row,'CATEGORY',index))+'</option>').join('');const periods=BI.state.data.periods||[];BI.$('filterDATE').innerHTML='<option value="">Current certified period</option>'+periods.map(row=>'<option value="'+BI.escape(row.entityId)+'">'+BI.escape(row.periodStart.slice(0,7))+'</option>').join('');},
  select(level,id){this.levels.forEach(other=>{if(other!==level)BI.$('filter'+other).value=''});BI.state.activeLevel=id?level:'COMPANY';BI.state.scope=id?BI.findEntity(level,id):BI.state.data.executive;BI.state.page=1;BI.render();},
  selectDate(id){BI.state.activeLevel=id?'DATE':'COMPANY';BI.state.scope=id?(BI.state.data.periods||[]).find(x=>x.entityId===id):BI.state.data.executive;BI.state.page=1;BI.render();},
  clear(){this.levels.concat(['DATE','REGION','CATEGORY']).forEach(level=>BI.$('filter'+level).value='');BI.$('globalSearch').value='';BI.state.search='';BI.state.activeLevel='COMPANY';BI.state.scope=BI.state.data.executive;BI.state.page=1;BI.render();}
};
</script>
